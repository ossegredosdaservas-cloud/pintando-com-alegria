            overflow: hidden;

        const TopAppBar = ({ onBack, onHelp, onSettings }) => (

                    <button onClick={onHelp} className="hidden md:flex items-center gap-2 bg-tertiary text-white px-4 py-2 rounded-full font-display text-sm shadow-chunky animate-pop cursor-pointer">

        const DonationPopup = ({ isOpen, onClose }) => {

            return (

        const PaintingCanvas = ({ tool, color, brushSize }) => {
            const canvasRef = useRef(null);
            const contextRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);

            useEffect(() => {
                const canvas = canvasRef.current;
                const parent = canvas.parentElement;
                canvas.width = parent.clientWidth;
                canvas.height = parent.clientHeight;
                const ctx = canvas.getContext('2d');
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                contextRef.current = ctx;

                const handleResize = () => {
                    const temp = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    canvas.width = parent.clientWidth;
                    canvas.height = parent.clientHeight;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.putImageData(temp, 0, 0);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const getPos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const startDrawing = (e) => {
                setIsDrawing(true);
                const { x, y } = getPos(e);
                const ctx = contextRef.current;
                ctx.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
                
                if (tool === 'magic') {
                    const hue = (Date.now() / 10) % 360;
                    ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                    ctx.lineWidth = brushSize + Math.sin(Date.now() / 100) * 5;
                } else {
                    ctx.strokeStyle = color;
                    ctx.lineWidth = tool === 'brush' ? brushSize * 2 : brushSize;
                }
                
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const draw = (e) => {
                if (!isDrawing) return;
                const { x, y } = getPos(e);
                const ctx = contextRef.current;
                
                if (tool === 'magic') {
                    const hue = (Date.now() / 10) % 360;
                    ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
                    ctx.lineWidth = brushSize + Math.sin(Date.now() / 100) * 5;
                }
                
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            return (
                <canvas 
                    ref={canvasRef} 
                    onMouseDown={startDrawing} onMouseMove={draw} onMouseUp={() => setIsDrawing(false)} 
                    onTouchStart={startDrawing} onTouchMove={draw} onTouchEnd={() => setIsDrawing(false)}
                    className="absolute inset-0 w-full h-full cursor-crosshair"
                />
            );
        };

                        </div>

                        {gameState === 'home' && <HeroSection onPlay={() => setGameState('gallery')} />}
                        
                        {gameState === 'gallery' && (
                            <div className="w-full h-full overflow-y-auto pt-4 relative z-10 scrollbar-hide">
                                <AnimalGallery onSelect={handleAnimalSelect} />
                            </div>
                        )}

                        {gameState === 'playing' && (
                            <div className="w-full h-full flex flex-col items-center justify-center p-4 md:p-12 relative z-10">
                                <div className="bg-white rounded-2xl shadow-chunky w-[90vw] h-[75dvh] md:w-full md:h-auto md:max-w-5xl md:aspect-[16/9] relative overflow-hidden border-4 md:border-8 border-primary-container">
                                    {selectedAnimal && (
                                        <div className="absolute inset-0 opacity-60 pointer-events-none p-0 flex items-center justify-center">
                                            <img src={selectedAnimal.src} alt="Sketch" className="w-full h-full object-contain mix-blend-multiply contrast-200" />
                                        </div>
                                    )}
                                    <PaintingCanvas 
                                        tool={activeTool} 
                                        color={activeColor} 
                                        brushSize={
                                            activeTool === 'brush' ? 12 : 
                                            activeTool === 'pencil' ? 4 : 
                                            activeTool === 'magic' ? 20 : 10
                                        } 
                                    />
                                    
                                    <div className="absolute top-4 left-4 flex gap-4 z-30">
                                        <button onClick={() => setGameState('gallery')} className="bg-tertiary text-white px-4 py-2 rounded-full font-display text-sm shadow-chunky animate-pop cursor-pointer">MUDAR ANIMAL</button>
                                    </div>

                                    <aside className="absolute right-4 top-1/2 -translate-y-1/2 flex flex-col gap-2 z-30 scale-75 md:scale-100">
                                        {[
                                            { color: '#b91a24', label: 'Vermelho' },
                                            { color: '#705d00', label: 'Amarelo' },
                                            { color: '#0058be', label: 'Azul' },
                                            { color: '#22c55e', label: 'Verde' },
                                            { color: '#f97316', label: 'Laranja' },
                                            { color: '#a855f7', label: 'Roxo' },
                                            { color: '#000000', label: 'Preto' },
                                        ].map((c) => (
                                            <button key={c.color} onClick={() => { setActiveColor(c.color); if(activeTool === 'eraser') setActiveTool('pencil'); }} className={`flex items-center transition-all cursor-pointer ${activeColor === c.color && activeTool !== 'eraser' ? '-translate-x-4' : ''}`}>
                                                <div className="w-12 h-24 rounded-l-full rounded-r-lg border-r-4 border-black/10 shadow-md" style={{ backgroundColor: c.color }}>
                                                    <div className="w-full h-8 bg-black/10 rounded-t-full" />
                                                </div>
                                            </button>
                                        ))}
                                    </aside>

                                    <aside className="absolute left-4 top-1/2 -translate-y-1/2 flex flex-col gap-4 z-30 items-center scale-90 md:scale-100">
                                        {/* Tool Selection */}
                                        <button onClick={() => setActiveTool('pencil')} className={`flex flex-col items-center gap-1 transition-all cursor-pointer ${activeTool === 'pencil' ? 'text-primary' : 'text-slate-400'}`}>
                                            <div className={`w-14 h-14 rounded-full flex items-center justify-center shadow-md ${activeTool === 'pencil' ? 'bg-primary-container' : 'bg-white'}`}>
                                                <img src="https://cdn-icons-png.flaticon.com/512/588/588395.png" alt="Pencil" className="w-8 h-8" />
                                            </div>
                                            <span className="text-[10px] font-bold uppercase">Lápis</span>
                                        </button>

                                        <button onClick={() => setActiveTool('brush')} className={`flex flex-col items-center gap-1 transition-all cursor-pointer ${activeTool === 'brush' ? 'text-primary' : 'text-slate-400'}`}>
                                            <div className={`w-14 h-14 rounded-full flex items-center justify-center shadow-md ${activeTool === 'brush' ? 'bg-primary-container' : 'bg-white'}`}>
                                                <img src="https://cdn-icons-png.flaticon.com/512/1048/1048953.png" alt="Brush" className="w-8 h-8" />
                                            </div>
                                            <span className="text-[10px] font-bold uppercase">Pincel</span>
                                        </button>

                                        <button onClick={() => setActiveTool('magic')} className={`flex flex-col items-center gap-1 transition-all cursor-pointer ${activeTool === 'magic' ? 'text-primary' : 'text-slate-400'}`}>
                                            <div className={`w-14 h-14 rounded-full flex items-center justify-center shadow-md ${activeTool === 'magic' ? 'bg-primary-container' : 'bg-white'}`}>
                                                <img src="https://cdn-icons-png.flaticon.com/512/1039/1039328.png" alt="Magic" className="w-8 h-8" />
                                            </div>
                                            <span className="text-[10px] font-bold uppercase">Mágica</span>
                                        </button>

                                        <div className="w-12 h-1 bg-slate-200 my-2 rounded-full" />

                                        <button onClick={() => setActiveTool('eraser')} className={`flex flex-col items-center gap-2 transition-all cursor-pointer ${activeTool === 'eraser' ? '-translate-y-2' : ''}`}>
                                            <div className={`w-16 h-18 rounded-lg border-b-[6px] flex items-center justify-center shadow-lg ${activeTool === 'eraser' ? 'bg-[#ff8eb2] border-[#d15e81] translate-y-2 border-b-0' : 'bg-[#ff8eb2]/80 border-[#d15e81]/80'}`}>
                                                <img src="https://cdn-icons-png.flaticon.com/512/2661/2661294.png" alt="Eraser" className="w-10 h-10 object-contain" />
                                            </div>
                                            <span className="font-label text-[10px] uppercase text-tertiary font-bold">Borracha</span>
                                        </button>
                                    </aside>
                                </div>
                            </div>
                        )}
                    </div>
                </main>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
